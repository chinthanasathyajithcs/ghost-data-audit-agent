<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
  <title id="t">How it works: seven steps from one request to a verdict</title>
  <desc id="d">Seven steps along a path. One, did they ask: read the request in any language, with AI. Two, who are they: find every email they ever used. Three, read it all: databases, logs, PDFs and screenshots, with AI for pictures. Four, link records: exact matches only. Five, what was true: snapshots from before audit day. Six, apply policy: delete, redact, anonymize or keep, with AI to name record types. Seven, verdict and plan: find, fix, then check. AI is used only where reading needs judgment; everything else is plain, testable code.</desc>
  <style>
    /*FONTS*/
    /*STYLE*/
  </style>
  <defs>
    <!--DEFS-->
  </defs>

  <rect class="bg" width="1200" height="630" rx="24"/>

  <!-- Header -->
  <text x="60" y="62" class="hand agent-t" font-size="30">The big picture</text>
  <text x="60" y="110" class="h" font-size="42">From one request to a verdict</text>
  <text x="62" y="148" class="muted" font-size="20">Seven steps. Each one hands a little more evidence to the next.</text>

  <!-- the path -->
  <path class="scribble dashed" d="M52 300Q94 282 137 300Q214 318 291 300Q368 282 445 300Q522 318 599 300Q676 282 753 300Q830 318 907 300Q984 282 1061 300Q1104 316 1144 300"/>
  <path class="scribble" d="M1132 290l13 10-13 10"/>

  <!-- a ghost peeking out from behind step 5 -->
  <use href="#ghost" x="780" y="236" width="34" height="39"/>

  <!-- stations -->
  <g>
    <circle class="obj-agent" cx="137" cy="300" r="46"/>
    <g transform="translate(137 300)"><path class="line-agent" d="M-18-16h36a6 6 0 0 1 6 6v16a6 6 0 0 1-6 6h-18l-9 8v-8h-9a6 6 0 0 1-6-6v-16a6 6 0 0 1 6-6z"/><path class="line-agent" d="M-10-5h20M-10 3h12"/></g>

    <circle class="obj-agent" cx="291" cy="300" r="46"/>
    <g transform="translate(291 300)"><circle class="line-agent" cx="-6" cy="-8" r="8"/><path class="line-agent" d="M-21 17c0-14 30-14 30 0"/><text x="7" y="2" class="agent-t" font-size="20" font-weight="700">@</text></g>

    <circle class="obj-agent" cx="445" cy="300" r="46"/>
    <g transform="translate(445 300)"><rect class="line-agent" x="-16" y="-20" width="24" height="30" rx="3"/><rect class="obj-agent" x="-8" y="-12" width="24" height="30" rx="3"/><path class="line-agent" d="M-3-3h14M-3 4h14M-3 11h8"/></g>

    <circle class="obj-agent" cx="599" cy="300" r="46"/>
    <g transform="translate(599 300) rotate(-35)"><rect class="line-agent" x="-22" y="-7" width="24" height="14" rx="7"/><rect class="line-agent" x="-2" y="-7" width="24" height="14" rx="7"/></g>

    <circle class="obj-agent" cx="753" cy="300" r="46"/>
    <g transform="translate(753 300)"><circle class="line-agent" r="18"/><path class="line-agent" d="M0-10V0l8 6"/></g>

    <circle class="obj-agent" cx="907" cy="300" r="46"/>
    <g transform="translate(907 300)"><path class="line-agent" d="M0-18v34M-12 16h24M-19-10h38M-19-10l-6 12h12zM19-10l-6 12h12z"/></g>

    <circle class="obj-agent" cx="1061" cy="300" r="46"/>
    <g transform="translate(1061 300)"><rect class="line-agent" x="-14" y="-18" width="28" height="36" rx="4"/><rect class="obj-agent" x="-6" y="-22" width="12" height="7" rx="2"/><path class="line-agent" d="M-8-5l3 3 5-5M3-4h5M-8 7l3 3 5-5M3 8h5"/></g>
  </g>

  <!-- number badges -->
  <g font-size="15" font-weight="700" text-anchor="middle">
    <circle class="dot-agent" cx="103" cy="266" r="14"/><text x="103" y="271" class="on-dark">1</text>
    <circle class="dot-agent" cx="257" cy="266" r="14"/><text x="257" y="271" class="on-dark">2</text>
    <circle class="dot-agent" cx="411" cy="266" r="14"/><text x="411" y="271" class="on-dark">3</text>
    <circle class="dot-agent" cx="565" cy="266" r="14"/><text x="565" y="271" class="on-dark">4</text>
    <circle class="dot-agent" cx="719" cy="266" r="14"/><text x="719" y="271" class="on-dark">5</text>
    <circle class="dot-agent" cx="873" cy="266" r="14"/><text x="873" y="271" class="on-dark">6</text>
    <circle class="dot-agent" cx="1027" cy="266" r="14"/><text x="1027" y="271" class="on-dark">7</text>
  </g>

  <!-- AI tags -->
  <use href="#ai" x="150" y="236" width="44" height="24"/>
  <use href="#ai" x="458" y="236" width="44" height="24"/>
  <use href="#ai" x="920" y="236" width="44" height="24"/>

  <!-- labels -->
  <g text-anchor="middle">
    <text x="137" y="388" class="h" font-size="19">Did they ask?</text>
    <text x="137" y="414" class="muted" font-size="15.5">Reads the request,</text>
    <text x="137" y="434" class="muted" font-size="15.5">in any language</text>

    <text x="291" y="388" class="h" font-size="19">Who are they?</text>
    <text x="291" y="414" class="muted" font-size="15.5">Finds every email</text>
    <text x="291" y="434" class="muted" font-size="15.5">they ever used</text>

    <text x="445" y="388" class="h" font-size="19">Read it all</text>
    <text x="445" y="414" class="muted" font-size="15.5">Databases, logs,</text>
    <text x="445" y="434" class="muted" font-size="15.5">PDFs, screenshots</text>

    <text x="599" y="388" class="h" font-size="19">Link records</text>
    <text x="599" y="414" class="muted" font-size="15.5">Exact matches only,</text>
    <text x="599" y="434" class="muted" font-size="15.5">never a guess</text>

    <text x="753" y="388" class="h" font-size="19">What was true?</text>
    <text x="753" y="414" class="muted" font-size="15.5">Snapshots from</text>
    <text x="753" y="434" class="muted" font-size="15.5">before audit day</text>

    <text x="907" y="388" class="h" font-size="19">Apply policy</text>
    <text x="907" y="414" class="muted" font-size="15.5">Delete, redact,</text>
    <text x="907" y="434" class="muted" font-size="15.5">anonymize or keep</text>

    <text x="1061" y="388" class="h" font-size="19">Verdict + plan</text>
    <text x="1061" y="414" class="muted" font-size="15.5">Find, fix,</text>
    <text x="1061" y="434" class="muted" font-size="15.5">then check</text>
  </g>

  <!-- legend + takeaway -->
  <use href="#ai" x="418" y="490" width="44" height="24"/>
  <text x="472" y="507" class="muted" font-size="16">= an AI model helps with this step</text>
  <text x="600" y="580" text-anchor="middle" class="hand" font-size="30">AI only where reading needs judgment. Everything else is plain, testable code.</text>
</svg>
